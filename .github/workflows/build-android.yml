name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages and accept licenses
        run: |
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Godot runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcursor1 libxrandr2 libxinerama1 libgl1 \
            libpulse0 libasound2 libpcre2-8-0 unzip curl ca-certificates || true

      - name: Download Godot 4.3
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Download export templates
        run: |
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p tpl_extract
          unzip -o templates.tpz -d tpl_extract
          if [ -d tpl_extract/templates ]; then
            cp -r tpl_extract/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          else
            cp -r tpl_extract/* ~/.local/share/godot/export_templates/4.3.stable/
          fi
          ls -la ~/.local/share/godot/export_templates/4.3.stable | head

      - name: Configure Godot editor settings (Android + Java SDK paths)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "--- editor settings ---"
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Install Android build template
        run: |
          ./godot --headless --install-android-build-template

      - name: Export Android APK
        run: |
          mkdir -p build
          ./godot --headless --export-release "Android" build/ashen-oath.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashen-oath-android
          path: build/ashen-oath.apk
          if-no-files-found: error
